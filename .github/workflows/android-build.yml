name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi

            echo "Android SDK install failed (attempt $attempt/3); retrying..." >&2
            sleep $((attempt * 10))
          done

          echo "Android SDK installation failed after 3 attempts." >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare stable signing
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [[ "$COMMIT_MESSAGE" == release:* ]]; then
              echo "Release signing is not configured. Add the ANDROID_SIGNING_BUNDLE repository secret." >&2
              exit 1
            fi
            echo "Stable signing is not configured; this development build will use the runner-local debug key."
            exit 0
          fi

          SIGNING_DIR="$RUNNER_TEMP/bdengine-signing"
          mkdir -p "$SIGNING_DIR"
          export SIGNING_DIR

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          try:
              payload = base64.b64decode(os.environ["SIGNING_BUNDLE"], validate=True)
              bundle = json.loads(payload.decode("utf-8"))
              keystore = base64.b64decode(bundle["keystore_base64"], validate=True)
              store_password = bundle["store_password"]
              key_alias = bundle["key_alias"]
              key_password = bundle["key_password"]
          except Exception as exc:
              raise SystemExit(f"ANDROID_SIGNING_BUNDLE is invalid: {exc}")

          required = {
              "store_password": store_password,
              "key_alias": key_alias,
              "key_password": key_password,
          }
          if any(not str(value).strip() for value in required.values()):
              raise SystemExit("ANDROID_SIGNING_BUNDLE contains an empty signing field")

          signing_dir = Path(os.environ["SIGNING_DIR"])
          keystore_path = signing_dir / "bdengine-release.jks"
          keystore_path.write_bytes(keystore)
          keystore_path.chmod(0o600)

          print(f"::add-mask::{store_password}")
          print(f"::add-mask::{key_password}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ANDROID_KEYSTORE_PATH={keystore_path}\n")
              env_file.write(f"ANDROID_KEYSTORE_PASSWORD={store_password}\n")
              env_file.write(f"ANDROID_KEY_ALIAS={key_alias}\n")
              env_file.write(f"ANDROID_KEY_PASSWORD={key_password}\n")
          PY

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signing
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          if [ "${{ steps.signing.outputs.configured }}" != "true" ]; then
            echo "APK was not built with the persistent signing secret." >&2
            exit 1
          fi
          echo "Persistent Android signing verified."

      - name: Package source code
        run: git archive --format=zip --output=BDEngine-mobile-source.zip HEAD

      - name: Prepare release APK name
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "BDEngine-Mobile-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BDEngine-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload source code
        uses: actions/upload-artifact@v6
        with:
          name: BDEngine-mobile-source
          path: BDEngine-mobile-source.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="BDEngine-Mobile-${VERSION}.apk"
          NOTES="$RUNNER_TEMP/release-notes.md"

          cat > "$NOTES" <<'EOF'
          - Постоянная подпись APK
          - Новое уведомление загрузки
          - Открыть с устройства (Beta)
          - Пользовательское соглашение
          - Добавлена локализация
          - Улучшена работа приложения в фоне
          - Исправлена прокрутка главной страницы
          - Обновлена система сборки и GitHub Actions
          - Автоматическая проверка подписи APK
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" BDEngine-mobile-source.zip --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              "$APK" \
              BDEngine-mobile-source.zip \
              --target "$GITHUB_SHA" \
              --title "BDEngine Mobile v${VERSION}" \
              --notes-file "$NOTES"
          fi
