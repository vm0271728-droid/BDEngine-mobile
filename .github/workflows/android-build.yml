name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Package source code
        run: git archive --format=zip --output=BDEngine-mobile-source.zip HEAD

      - name: Prepare release APK name
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "BDEngine-Mobile-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BDEngine-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: BDEngine-mobile-source
          path: BDEngine-mobile-source.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="BDEngine-Mobile-${VERSION}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" BDEngine-mobile-source.zip --clobber
          else
            gh release create "$TAG" \
              "$APK" \
              BDEngine-mobile-source.zip \
              --target "$GITHUB_SHA" \
              --title "BDEngine Mobile v${VERSION}" \
              --notes "Неофициальное Android-приложение для BDEngine.\n\nВ релиз включены APK и архив исходного кода текущей версии."
          fi
